<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Alto Voltaje | Citas Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Barbería Premium</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <h1>Bienvenido</h1>
                <p>Cortes modernos, barbas clásicas y el mejor ambiente.</p>
                <img src="https://via.placeholder.com/400x250" class="img-fluid rounded" alt="Peluquería">
            </div>

            <div class="col-md-6 bg-white p-4 shadow-sm rounded">
                <h3>Reserva tu cita</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Tu Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha y Hora</label>
                        <input type="datetime-local" class="form-control" id="fecha">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Confirmar Reserva</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
