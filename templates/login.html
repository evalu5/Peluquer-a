<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card shadow p-4">
                <h3 class="text-center mb-4">Acceso Staff</h3>
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Contraseña Maestra</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Entrar al Panel</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/" class="small text-muted text-decoration-none">← Volver a la web</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
