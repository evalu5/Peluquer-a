<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva Confirmada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card-confirm { background: #1e1e1e; padding: 3rem; border-radius: 20px; border: 1px solid #d4af37; }
        .btn-ws { background-color: #25D366; color: white; font-weight: bold; padding: 12px 25px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 20px; }
        .dorado { color: #d4af37; }
    </style>
</head>
<body>
    <div class="card-confirm shadow-lg">
        <i class="bi bi-check-circle-fill dorado display-1"></i>
        <h2 class="mt-4">¡Casi listo, <span class="dorado">{{ nombre }}</span>!</h2>
        <p>Tu cita para el <strong>{{ fecha }}</strong> se ha registrado.</p>
        <p class="text-white-50">Para que el barbero te confirme el hueco, pulsa el botón de abajo:</p>
        
        <a href="{{ link_ws }}" target="_blank" class="btn-ws">
            <i class="bi bi-whatsapp"></i> Confirmar por WhatsApp
        </a>
        <br><br>
        <a href="/" class="text-white-50 small">Volver al inicio</a>
    </div>
</body>
</html>
