<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cita Reservada | Alto Voltaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; padding-top: 100px; }
        .card { background: #252525; border: 2px solid #ffea00; padding: 40px; border-radius: 20px; max-width: 500px; margin: auto; }
        .btn-ws { background: #25d366; color: white; font-weight: bold; border-radius: 10px; padding: 15px; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card shadow-lg">
        <h1 style="color: #ffea00;">¡LISTO, {{ nombre }}! ⚡</h1>
        <p class="fs-5 mt-3">Tu cita para el <b>{{ fecha }}</b> se ha registrado.</p>
        <hr style="border-color: #444;">
        <p class="small text-muted">Para terminar, confirma ahora por WhatsApp:</p>
        <a href="{{ link_ws }}" class="btn-ws">CONFIRMAR POR WHATSAPP ✅</a>
        <br>
        <a href="/" style="color: #888; text-decoration: none; font-size: 0.8rem;">Volver al inicio</a>
    </div>
</body>
<div class="mt-4 p-3" style="background: rgba(255,0,0,0.1); border-radius: 10px; border: 1px solid #ff4444;">
    <p class="small mb-0"><b>¿Quieres cancelar o cambiar tu cita?</b><br>
    Escríbenos directamente por WhatsApp avisando con antelación.</p>
</div>
</html>
